<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecuador Shrimp Pond Detector</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root {
      --panel-bg: rgba(255, 255, 255, 0.94);
      --panel-border: rgba(255, 255, 255, 0.35);
      --text-strong: #102028;
      --text-muted: #4b616d;
      --primary: #2279d6;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      color: var(--text-strong);
      background: #e6edf1;
    }
    #map { height: 100%; width: 100%; }
    .toolbar {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(7px);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.18);
      width: min(300px, calc(100vw - 28px));
    }
    .toolbar h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }
    .subtitle {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .toolbar h3 {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .toolbar-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(16, 32, 40, 0.12);
    }
    .toolbar-controls {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ghost-btn {
      border: 1px solid rgba(34, 121, 214, 0.26);
      color: var(--primary);
      background: rgba(34, 121, 214, 0.08);
      border-radius: 999px;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .ghost-btn:hover { background: rgba(34, 121, 214, 0.15); }
    .year-list {
      display:flex;
      flex-direction: column;
      gap: 4px;
      max-height: min(40vh, 320px);
      overflow:auto;
      padding-right: 4px;
      margin-top: 8px;
    }
    .year-item {
      display:flex;
      align-items:center;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px;
      border-radius: 8px;
      transition: background 140ms ease;
    }
    .year-item:hover { background: rgba(0, 0, 0, 0.045); }
    .year-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); }
    .basemap-options {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .basemap-option {
      border: 1px solid rgba(16, 32, 40, 0.16);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.7);
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .slider-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .slider-wrap input { width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <h2>Ecuador Pond Detector</h2>
    <p class="subtitle">Toggle shrimp pond layers by year</p>

    <div class="toolbar-section">
      <h3>Years</h3>
      <div class="toolbar-controls">
        <button id="selectAll" class="ghost-btn" type="button">Select all</button>
        <button id="clearAll" class="ghost-btn" type="button">Clear all</button>
      </div>
      <div id="yearList" class="year-list"></div>
      <div class="slider-wrap">
        <span>Opacity</span>
        <input id="opacitySlider" type="range" min="0.05" max="0.8" step="0.05" value="0.25" />
      </div>
      <div id="status" class="status">0 years visible</div>
    </div>

    <div class="toolbar-section basemap">
      <h3>Basemap</h3>
      <div class="basemap-options">
        <label class="basemap-option"><input type="radio" name="basemap" value="osm" checked>OSM</label>
        <label class="basemap-option"><input type="radio" name="basemap" value="esri"> Esri</label>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <script>
    // =====================
    // HOW THIS VERSION WORKS
    // =====================
    // Instead of loading raw Shapefiles (heavy), we load *vector tiles* from .pmtiles files.
    // PMTiles is a single-file tile archive that works on static hosting (e.g., GitHub Pages)
    // via HTTP range requests — no server code needed.

    // 1) Convert each year's Shapefile -> GeoJSONL -> PMTiles (see CLI commands in the chat).
    // 2) Put 2018.pmtiles, 2019.pmtiles, ... next to this HTML.
    // 3) Update the SOURCES list below if you change filenames.

    // ========== CONFIG ==========
    const INITIAL_VIEW = { center: [-79.92, -2.17], zoom: 8.8 }; // [lng, lat]

    // pmtiles filenames (relative to this html)
    const SOURCES = [
      { year: 2019, url: './2019.pmtiles' },
      { year: 2020, url: './2020.pmtiles' },
      { year: 2021, url: './2021.pmtiles' },
      { year: 2022, url: './2022.pmtiles' },
      { year: 2023, url: './2023.pmtiles' },
      { year: 2024, url: './2024.pmtiles' },
    ];

    // fixed distinct colors
    const COLORS = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#17becf'];

    // ========== MAP INIT ==========
    // Register PMTiles protocol
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile);

    const map = new maplibregl.Map({
      container: 'map',
      center: INITIAL_VIEW.center,
      zoom: INITIAL_VIEW.zoom,
      style: {
        version: 8,
        sources: {
          // OSM raster basemap
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors'
          },
          // Esri imagery basemap
          esri: {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            attribution: 'Tiles © Esri'
          }
        },
        layers: [
          { id: 'basemap-osm', type: 'raster', source: 'osm', layout: { visibility: 'visible' } },
          { id: 'basemap-esri', type: 'raster', source: 'esri', layout: { visibility: 'none' } },
          // vector layers get appended after load
        ]
      }
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    // Build year toggles and lazy-add vector tile sources/layers
    const yearListEl = document.getElementById('yearList');
    const statusEl = document.getElementById('status');
    const opacitySliderEl = document.getElementById('opacitySlider');
    const added = new Map(); // year -> true once added
    const checkboxes = [];

    function getSelectedCount() {
      return checkboxes.filter(cb => cb.checked).length;
    }

    function updateStatus() {
      const count = getSelectedCount();
      statusEl.textContent = `${count} year${count === 1 ? '' : 's'} visible`;
    }

    function setYearVisibility(src, isVisible) {
      ensureYearLayer(src);
      const vis = isVisible ? 'visible' : 'none';
      ['fill','line'].forEach(t => {
        const layerId = `${t}-${src.year}`;
        if (map.getLayer(layerId)) map.setLayoutProperty(layerId, 'visibility', vis);
      });
    }

    function addYearCheckbox(year, color) {
      const row = document.createElement('label');
      row.className = 'year-item';
      const main = document.createElement('span');
      main.className = 'year-main';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = `year-${year}`;
      cb.checked = false;
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = color;
      const txt = document.createElement('span');
      txt.textContent = String(year);
      main.appendChild(cb); main.appendChild(sw); main.appendChild(txt);
      row.appendChild(main);
      yearListEl.appendChild(row);
      return cb;
    }

    function ensureYearLayer(src) {
      const { year, url } = src;
      if (added.get(year)) return;

      // Create a PMTiles instance - not strictly necessary for MapLibre, but handy for bounds
      const p = new pmtiles.PMTiles(url);

      map.addSource(`year-${year}`, {
        type: 'vector',
        url: `pmtiles://${url}`
      });

      // Layer names: Tippecanoe default is the input layer name; we'll assume it's also `${year}`.
      // If your tippecanoe layer name differs, change "source-layer" below accordingly.
      map.addLayer({
        id: `fill-${year}`,
        type: 'fill',
        source: `year-${year}`,
        'source-layer': `${year}`,
        paint: {
          'fill-color': COLORS[SOURCES.findIndex(s=>s.year===year) % COLORS.length],
          'fill-opacity': 0.25
        },
        layout: { visibility: 'none' }
      });
      map.addLayer({
        id: `line-${year}`,
        type: 'line',
        source: `year-${year}`,
        'source-layer': `${year}`,
        paint: {
          'line-color': COLORS[SOURCES.findIndex(s=>s.year===year) % COLORS.length],
          'line-width': 1.2
        },
        layout: { visibility: 'none' }
      });

      // Fit to bounds on first enable (best-effort)
      p.getHeader().then(h => {
        if (!h || !h.minLon) return; // header might not have bounds in very old pmtiles
        const b = [[h.minLon, h.minLat],[h.maxLon, h.maxLat]];
        try { map.fitBounds(b, { padding: 20, maxZoom: 14 }); } catch (_) {}
      }).catch(()=>{});

      added.set(year, true);
    }

    // Initialize UI
    SOURCES.forEach((src, i) => {
      const color = COLORS[i % COLORS.length];
      const cb = addYearCheckbox(src.year, color);
      checkboxes.push(cb);
      cb.addEventListener('change', () => {
        setYearVisibility(src, cb.checked);
        updateStatus();
      });
    });

    document.getElementById('selectAll').addEventListener('click', () => {
      SOURCES.forEach((src, i) => {
        const cb = checkboxes[i];
        cb.checked = true;
        setYearVisibility(src, true);
      });
      updateStatus();
    });

    document.getElementById('clearAll').addEventListener('click', () => {
      SOURCES.forEach((src, i) => {
        const cb = checkboxes[i];
        cb.checked = false;
        setYearVisibility(src, false);
      });
      updateStatus();
    });

    opacitySliderEl.addEventListener('input', () => {
      const value = Number(opacitySliderEl.value);
      SOURCES.forEach(src => {
        const layerId = `fill-${src.year}`;
        if (map.getLayer(layerId)) map.setPaintProperty(layerId, 'fill-opacity', value);
      });
    });

    // Basemap switcher
    document.querySelectorAll('input[name="basemap"]').forEach(r => {
      r.addEventListener('change', (e) => {
        const val = e.target.value;
        map.setLayoutProperty('basemap-osm', 'visibility', val==='osm' ? 'visible' : 'none');
        map.setLayoutProperty('basemap-esri', 'visibility', val==='esri' ? 'visible' : 'none');
      });
    });

    updateStatus();
  </script>
</body>
</html>
